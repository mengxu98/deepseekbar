name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build app and DMG
        run: ./build.sh
        env:
          UNIVERSAL: "1"

      - name: Check release readiness
        run: scripts/check_release_readiness.sh

      - name: Validate manual version
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+(\.[0-9]+)*([-+][A-Za-z0-9.-]+)?$ ]]; then
            echo "Invalid release version"
            exit 1
          fi
          build_version="$(awk -F'"' '/^APP_VERSION=/ { print $2; exit }' build.sh)"
          if [[ "${RELEASE_VERSION}" != "v${build_version}" ]]; then
            echo "Manual release version ${RELEASE_VERSION} does not match build.sh APP_VERSION ${build_version}"
            exit 1
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: DeepSeekBar ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: .build/release/DeepSeekBar.dmg
